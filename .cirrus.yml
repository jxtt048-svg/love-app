task:
  name: Build unsigned IPA
  macos_instance:
    image: ghcr.io/cirruslabs/macos-runner:sonoma

  env:
    HOMEBREW_NO_AUTO_UPDATE: "1"

  info_script:
    - xcodebuild -version
    - xcrun --sdk iphoneos --show-sdk-version

  install_script:
    - brew install mint
    - mint install yonaskolb/XcodeGen@2.44.1

  generate_script:
    - mint run xcodegen generate

  build_script: |
    set -o pipefail
    xcodebuild \
      -project LoveApp.xcodeproj \
      -scheme LoveApp \
      -configuration Release \
      -sdk iphoneos \
      -derivedDataPath build \
      CODE_SIGNING_ALLOWED=NO \
      CODE_SIGNING_REQUIRED=NO \
      CODE_SIGN_IDENTITY="" \
      build

  package_script:
    - mkdir -p Payload
    - cp -R build/Build/Products/Release-iphoneos/LoveApp.app Payload/
    - zip -qry LoveApp.ipa Payload

  ipa_artifacts:
    path: LoveApp.ipa
    retention_days: 30
